<script>
  (function() {
    // Dynamic progressive boot loader simulation for high outdoor delight
    let progress = 28;
    const fillEl = document.getElementById('splash-progress-fill');
    const textEl = document.getElementById('splash-percentage');

    if (fillEl && textEl) {
      const interval = setInterval(() => {
        progress += Math.floor(Math.random() * 12) + 4;
        if (progress >= 100) {
          progress = 100;
          fillEl.style.width = '100%';
          textEl.textContent = '100%';
          clearInterval(interval);
        } else {
          fillEl.style.width = progress + '%';
          textEl.textContent = progress + '%';
        }
      }, 260);
    }
  })();
</script></main>

<script>
  // Auto-redirect from splash: if already logged in, go to home; else go to login
  window.addEventListener('load', () => {
    const splash = document.querySelector('.relative.w-full.min-h-screen');
    // Animate then redirect
    setTimeout(() => {
      let dest = './login.html';
      try {
        const state = JSON.parse(localStorage.getItem('borlaalert_global_state') || '{}');
        if (state.collector && state.collector.loggedIn) dest = './home.html';
      } catch(e) {}
      window.location.href = dest;
    }, 2400);
  });
</script>
