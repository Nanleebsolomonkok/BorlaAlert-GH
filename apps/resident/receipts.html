<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#006b2c">
  <title>Receipts History — BorlaAlert GH</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/components.css">

  <style>
    body {
      background-color: #f8faf7;
      font-family: 'Inter', sans-serif;
      max-width: 480px;
      margin: 0 auto;
      color: #17211b;
      min-height: 100vh;
    }
  </style>
</head>
<body class="antialiased">

  <!-- TOP NAV -->
  <header class="top-nav">
    <div class="nav-logo">
      <div class="nav-logo-icon" style="background: #006b2c;">
        <span class="material-symbols-outlined" style="font-size: 20px; color: white;">receipt_long</span>
      </div>
      <span class="nav-logo-text" style="color: #006b2c;">Receipts</span>
    </div>

    <a href="./home.html" class="nav-icon-btn" aria-label="Home" style="text-decoration: none; color: #17211b; width: 36px; height: 36px;">
      <span class="material-symbols-outlined">home</span>
    </a>
  </header>

  <!-- CONTENT -->
  <main class="page-content" style="padding-bottom: 84px;">

    <!-- CRITICAL INFO BANNER -->
    <div class="card card-amber" style="margin-top: 14px; border-left: 4px solid var(--amber); padding: 12px 14px;">
      <div style="font-weight: 700; color: #92400e; font-size: 12.5px; display: flex; align-items: center; gap: 4px; margin-bottom: 2px;">
        <span class="material-symbols-outlined" style="font-size: 16px;">info</span> Platform Fee Receipts Only
      </div>
      <p style="font-size: 12px; color: #92400e; line-height: 1.45; margin: 0;">
        These records represent your <strong>GH₵ 2.00 platform booking fees</strong>. Collector carting service fees are settled directly at your gate.
      </p>
    </div>

    <!-- RECEIPT LIST -->
    <div style="padding: 4px 16px;">
      <div class="section-title" style="margin-bottom: 8px;">ALL TRANSACTIONS</div>
      <div id="receipts-list-container" style="display: flex; flex-direction: column; gap: 8px;">
        <!-- Dynamically rendered -->
      </div>
    </div>

  </main>

  <!-- RESIDENT BOTTOM NAVIGATION -->
  <nav class="bottom-nav bottom-nav-4" aria-label="Main Navigation">
    <a href="./home.html" class="nav-tab">
      <span class="material-symbols-outlined nav-tab-icon">home</span>
      <span class="nav-tab-label">Home</span>
    </a>
    <a href="./pickups.html" class="nav-tab">
      <span class="material-symbols-outlined nav-tab-icon">inventory_2</span>
      <span class="nav-tab-label">Pickups</span>
    </a>
    <a href="./receipts.html" class="nav-tab active" aria-current="page">
      <span class="material-symbols-outlined nav-tab-icon" style="font-variation-settings: 'FILL' 1;">receipt_long</span>
      <span class="nav-tab-label">Receipts</span>
    </a>
    <a href="./account.html" class="nav-tab">
      <span class="material-symbols-outlined nav-tab-icon">person</span>
      <span class="nav-tab-label">Account</span>
    </a>
  </nav>

  <script src="../../shared-pwa.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      try {
        if (window.BorlaStore) {
          const pickups = window.BorlaStore.getPickups();
          const container = document.getElementById('receipts-list-container');
          if (!container) return;

          if (pickups.length === 0) {
            container.innerHTML = `
              <div class="card card-bordered" style="text-align: center; padding: 24px 16px; margin: 0; color: #5f6b62; font-size: 13px;">
                <span class="material-symbols-outlined" style="font-size: 32px; color: #8b978e; margin-bottom: 6px;">receipt_long</span>
                <p>No receipts found yet.</p>
              </div>
            `;
            return;
          }

          container.innerHTML = pickups.map(p => `
            <div class="card card-bordered" style="padding: 12px 14px; margin: 0; background: white; display: flex; flex-direction: column; gap: 6px;">
              <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                  <span style="font-family: monospace; font-size: 10.5px; font-weight: 700; color: #5f6b62;">${p.id}</span>
                  <div style="font-weight: 700; font-size: 13.5px; color: #17211b;">${p.category || 'Household Waste'}</div>
                  <div style="font-size: 11.5px; color: #5f6b62;">${p.date || 'Today'} • ${p.address || 'East Legon'}</div>
                </div>
                <div style="text-align: right;">
                  <span style="font-family: 'Epilogue', sans-serif; font-size: 14px; font-weight: 800; color: #15803d;">${p.momoFee || 'GH₵ 2.00'}</span>
                  <span class="badge badge-green" style="font-size: 10px; display: block; margin-top: 2px;">Settled</span>
                </div>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed #e2e8e3; padding-top: 6px; margin-top: 2px; font-size: 11.5px;">
                <span style="color: #5f6b62;">Collector: <strong>${p.collectorName || 'Emmanuel Mensah'}</strong></span>
                <a href="./receipt.html" style="color: #006b2c; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 2px;">
                  View Receipt →
                </a>
              </div>
            </div>
          `).join('');
        }
      } catch(e) {}
    });
  </script>
</body>
</html>
