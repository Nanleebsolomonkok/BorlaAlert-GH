-numeric-currency text-numeric-currency flex flex-col items-center justify-center active:bg-surface-container-high transition-transform active:scale-95 shadow-sm" type="button"><span class="">1</span></button><button data-num="2" class="key-btn h-12 rounded-xl bg-surface-container-lowest text-on-surface font-numeric-currency text-numeric-currency flex flex-col items-center justify-center active:bg-surface-container-high transition-transform active:scale-95 shadow-sm" type="button"><span class="">2</span><span class="text-[9px] font-body-sm text-outline -mt-1 tracking-widest font-normal">ABC</span></button><button data-num="3" class="key-btn h-12 rounded-xl bg-surface-container-lowest text-on-surface font-numeric-currency text-numeric-currency flex flex-col items-center justify-center active:bg-surface-container-high transition-transform active:scale-95 shadow-sm" type="button"><span class="">3</span><span class="text-[9px] font-body-sm text-outline -mt-1 tracking-widest font-normal">DEF</span></button><button data-num="4" class="key-btn h-12 rounded-xl bg-surface-container-lowest text-on-surface font-numeric-currency text-numeric-currency flex flex-col items-center justify-center active:bg-surface-container-high transition-transform active:scale-95 shadow-sm" type="button"><span class="">4</span><span class="text-[9px] font-body-sm text-outline -mt-1 tracking-widest font-normal">GHI</span></button><button data-num="5" class="key-btn h-12 rounded-xl bg-surface-container-lowest text-on-surface font-numeric-currency text-numeric-currency flex flex-col items-center justify-center active:bg-surface-container-high transition-transform active:scale-95 shadow-sm" type="button"><span class="">5</span><span class="text-[9px] font-body-sm text-outline -mt-1 tracking-widest font-normal">JKL</span></button><button data-num="6" class="key-btn h-12 rounded-xl bg-surface-container-lowest text-on-surface font-numeric-currency text-numeric-currency flex flex-col items-center justify-center active:bg-surface-container-high transition-transform active:scale-95 shadow-sm" type="button"><span class="">6</span><span class="text-[9px] font-body-sm text-outline -mt-1 tracking-widest font-normal">MNO</span></button><button data-num="7" class="key-btn h-12 rounded-xl bg-surface-container-lowest text-on-surface font-numeric-currency text-numeric-currency flex flex-col items-center justify-center active:bg-surface-container-high transition-transform active:scale-95 shadow-sm" type="button"><span class="">7</span><span class="text-[9px] font-body-sm text-outline -mt-1 tracking-widest font-normal">PQRS</span></button><button data-num="8" class="key-btn h-12 rounded-xl bg-surface-container-lowest text-on-surface font-numeric-currency text-numeric-currency flex flex-col items-center justify-center active:bg-surface-container-high transition-transform active:scale-95 shadow-sm" type="button"><span class="">8</span><span class="text-[9px] font-body-sm text-outline -mt-1 tracking-widest font-normal">TUV</span></button><button data-num="9" class="key-btn h-12 rounded-xl bg-surface-container-lowest text-on-surface font-numeric-currency text-numeric-currency flex flex-col items-center justify-center active:bg-surface-container-high transition-transform active:scale-95 shadow-sm" type="button"><span class="">9</span><span class="text-[9px] font-body-sm text-outline -mt-1 tracking-widest font-normal">WXYZ</span></button><div class="h-12 flex items-center justify-center"></div><button data-num="0" class="key-btn h-12 rounded-xl bg-surface-container-lowest text-on-surface font-numeric-currency text-numeric-currency flex flex-col items-center justify-center active:bg-surface-container-high transition-transform active:scale-95 shadow-sm" type="button"><span class="">0</span></button><button id="backspaceBtn" class="h-12 rounded-xl bg-surface-container text-on-surface font-label-md flex items-center justify-center active:bg-surface-container-high transition-transform active:scale-95 shadow-sm" type="button"><span class="material-symbols-outlined text-[22px]">backspace</span></button></div></div></div></div>
<script>
  let enteredOtp = ['4', '8', '2'];
  const slots = document.querySelectorAll('.otp-slot');
  const targetPhoneEl = document.getElementById('targetPhone');

  // Load saved phone if exists
  if (typeof BorlaStore !== 'undefined') {
    const user = BorlaStore.get().user;
    if (user && user.phone) {
      targetPhoneEl.textContent = user.phone;
    }
  }

  function updateSlots() {
    slots.forEach((slot, idx) => {
      const valSpan = slot.querySelector('.digit-val');
      if (idx < enteredOtp.length) {
        valSpan.textContent = enteredOtp[idx];
        slot.className = 'otp-slot flex-1 h-16 rounded-2xl bg-surface-container-high/60 border-2 border-primary/40 flex items-center justify-center font-headline-xl text-headline-xl text-on-surface font-bold select-none shadow-sm';
      } else if (idx === enteredOtp.length) {
        valSpan.textContent = '';
        slot.className = 'otp-slot flex-1 h-16 rounded-2xl bg-surface-container-lowest border-2 border-primary ring-4 ring-primary/10 flex items-center justify-center font-headline-xl text-headline-xl text-on-surface font-bold select-none shadow-md';
      } else {
        valSpan.textContent = '';
        slot.className = 'otp-slot flex-1 h-16 rounded-2xl bg-surface-container-low border-2 border-transparent flex items-center justify-center font-headline-xl text-headline-xl text-on-surface-variant/30 font-bold select-none';
      }
    });

    if (enteredOtp.length === 4) {
      setTimeout(handleVerify, 300);
    }
  }

  document.querySelectorAll('.key-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const num = btn.getAttribute('data-num');
      if (enteredOtp.length < 4) {
        enteredOtp.push(num);
        updateSlots();
      }
    });
  });

  const backspaceBtn = document.getElementById('backspaceBtn');
  if (backspaceBtn) {
    backspaceBtn.addEventListener('click', () => {
      if (enteredOtp.length > 0) {
        enteredOtp.pop();
        updateSlots();
      }
    });
  }

  function handleVerify() {
    const verifyBtn = document.getElementById('verifyBtn');
    if (verifyBtn) {
      verifyBtn.disabled = true;
      verifyBtn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span><span>Verifying Code...</span>';
    }
    setTimeout(() => {
      window.location.href = './home.html';
    }, 400);
  }

  function handleResend() {
    const cd = document.getElementById('countdown');
    if (cd) cd.textContent = '0:60';
    alert('A new SMS verification code has been dispatched to your phone!');
  }
</script></main>
